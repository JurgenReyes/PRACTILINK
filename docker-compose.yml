services:
  mysql:
    build:
      context: ./backend/database
      dockerfile: docker/Dockerfile
    container_name: practilink_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-Practilink2026!}
      MYSQL_DATABASE: practilink
    ports:
      - "3307:3306"
    volumes:
      - practilink_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_ROOT_PASSWORD:-Practilink2026!}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  practilink_mysql_data:
