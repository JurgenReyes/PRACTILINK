server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Todas las rutas de React Router (ej. /entrevistas, /vacantes/123) deben
  # devolver index.html para que la SPA maneje el ruteo del lado del cliente.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Los assets con hash en el nombre (JS/CSS de Vite) pueden cachearse fuerte.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
